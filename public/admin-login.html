<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a13" />
    <title>Acceso administrativo | Y & A</title>
    <link rel="stylesheet" href="Admin.css" />
  </head>
  <body class="login-page" data-page="admin-login">
    <main class="login-shell">
      <header class="login-header">
        <div>
          <p class="login-kicker">Acceso restringido</p>
          <h1>Administración</h1>
        </div>
        <a class="back-link" href="invitacion.html">Volver a la invitación</a>
      </header>

      <section class="login-card">
        <div class="login-badge" aria-hidden="true">Y &amp; A</div>
        <form id="admin-login-form" class="login-form" novalidate>
          <div class="login-field">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" placeholder="adminnovios" autocomplete="username" />
          </div>

          <div class="login-field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" />
          </div>

          <div class="login-meta">
            <button class="login-submit" type="submit">Entrar</button>
            <span id="login-status" class="login-status" aria-live="polite"></span>
          </div>
        </form>
      </section>
    </main>

    <script src="Admin.js"></script>
  </body>
</html>
